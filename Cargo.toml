[package]
name = "erdify-rs"
version = "0.1.0"
edition = "2024"
description = "CLI tool to generate Mermaid ER diagrams from PostgreSQL databases"
license = "MIT"

[[bin]]
name = "erdify"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
