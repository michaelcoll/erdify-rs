[hooks]
postinstall = "lefthook install"

[env]
# Database
DATABASE_URL = "postgresql://postgres:password@localhost:5432/postgres"

[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"go:github.com/evilmartians/lefthook/v2" = "latest"
"cargo:dprint" = "latest"

[tasks.checks]
description = "Runs all the checks for the project"
depends = ["test", "lint", "format"]

[tasks.clean]
description = "Cleans the project artifacts"
run = "cargo clean"

[tasks.setup]
description = "Setups the project for development"
run = "cargo fetch"

[tasks.test-db-up]
description = "Starts the local PostgreSQL test container erdify-test-db on port 5433 (needs Docker running)"
run = """
docker start erdify-test-db 2>/dev/null 1>&2 \
  || docker run -d --name erdify-test-db \
       -e POSTGRES_PASSWORD=password \
       -e POSTGRES_DB=postgres \
       -p 5433:5432 \
       postgres:18 1>&2
until docker exec erdify-test-db pg_isready -U postgres >/dev/null 2>&1; do sleep 0.5; done
"""

[tasks.test-db-down]
description = "Stops and removes the local PostgreSQL test container"
run = "docker rm -f erdify-test-db"

[tasks.test]
description = "Runs the tests, starting the PostgreSQL test container first (needs Docker running)"
depends = ["test-db-up"]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
run = "cargo nextest run --status-level slow --no-tests warn"

[tasks.lint-clippy]
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
run = "cargo clippy --locked --workspace --all-features --all-targets -- -A dead_code -D clippy::all"
hide = true

[tasks.lint]
description = "Lints the project"
depends = ["lint-clippy"]

[tasks.format]
description = "Formats the codebase"
run = ["cargo fmt", "dprint fmt"]
alias = ["f"]

[tasks.build]
description = "Builds the project"
run = "cargo build"
alias = ["b"]

[tasks.upgrade]
description = "Upgrades the project dependencies"
run = "cargo update"

[tasks.run]
description = "Runs the CLI"
run = "cargo run --"

[tasks.coverage-backend]
description = "Runs the tests with coverage, writing lcov.info (needs Docker running)"
depends = ["test-db-up"]
run = "cargo llvm-cov nextest --status-level slow --locked --workspace --all-features --tests --ignore-filename-regex \"main.rs\" --lcov --output-path lcov.info"
